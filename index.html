
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen Day - Hanane 👑</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hearts"></div>

    <main class="container">

        <div class="crown">👑</div>

        <div class="card" id="card">

            <div class="main-emoji">💗</div>

            <p class="small-title">UNE SURPRISE POUR TOI</p>

            <h1>Happy Queen Day !</h1>

            <h2>Hanane ❤️</h2>

            <p class="description">
                Aujourd'hui, c'est ton jour, ma Queen !
                J'ai une petite question à te poser...
            </p>

            <div class="question">
                Est-ce que tu m'aimes ? 🥺❤️
            </div>

            <div class="buttons-area" id="buttonsArea">

                <button class="yes-btn" id="yesBtn">
                    Oui ❤️
                </button>

                <button class="no-btn" id="noBtn">
                    Non 💔
                </button>

            </div>

            <p class="hint" id="hint">
                Choisis bien ta réponse... 😏
            </p>

        </div>

        <footer>
            Made with ❤️ just for you
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
